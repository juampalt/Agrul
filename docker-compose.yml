services:
  postgres:
    image: postgres:16-alpine
    container_name: agrul-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-agrul_db}
      POSTGRES_USER: ${POSTGRES_USER:-agrul_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-agrul_pass}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - agrul_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-agrul_user} -d ${POSTGRES_DB:-agrul_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  agrul_pg_data:
    driver: local
